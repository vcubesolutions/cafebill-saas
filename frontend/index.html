<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CafeBill — Billing Software</title>
    <meta name="description" content="Smart billing software for restaurants and cafes" />

    <!-- PWA theme & status bar -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA ("Add to Home Screen") support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CafeBill" />
    <link rel="apple-touch-icon" href="/app/icon.svg" />

    <!-- Web App Manifest (updated dynamically by JS for per-tenant name/start_url) -->
    <link rel="manifest" id="pwa-manifest" href="/app/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
